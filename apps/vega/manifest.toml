# Draw Your Hero for Fire TV (Vega OS).
# Based on Amazon's react-native-multi-tv-app-sample (MIT-0). The sample's
# video-player entries (DRM, content launcher, media controls) were removed:
# this app only plays narration and sound effects.
schema-version = 1

[package]
title = "Draw Your Hero"
version = "1.0.0"
id = "com.drawyourhero.tv"
icon = "@image/icon.png"

[os.version]
min = "1.2"
target = "1.2"

[components]
[[components.interactive]]
id = "com.drawyourhero.tv.main"
runtime-module = "/com.amazon.kepler.keplerscript.runtime.loader_2@IKeplerScript_2_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

[processes]
[[processes.group]]
component-ids = ["com.drawyourhero.tv.main"]

## Optional capabilities --------------------------------------------------------
[wants]
# Remote button events
[[wants.service]]
id = "com.amazon.inputd.service"

[[wants.service]]
id = "com.amazon.inputmethod.service"

# Audio playback for the narration (W3C media AudioPlayer)
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.audio.system"

# Network status
[[wants.service]]
id = "com.amazon.network.service"

# Accessibility (screen reader settings)
[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

## Required capabilities --------------------------------------------------------
[needs]
[[needs.privilege]]
id = "com.amazon.network.privilege.net-info"

[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

## Offers -----------------------------------------------------------------------

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.gesture_handler_2@IGestureHandler_0"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_2@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.reanimated_2@IReanimated_0"

[[needs.module]]
id = "/com.amazon.kepler.safe_area_context_2@ISafeAreaContext_0"

[[needs.module]]
id = "/com.amazon.kepler.screens_2@IScreens_0"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_1"

[[needs.module]]
id = "/com.amazon.kepler.navigation__core_7@INavigation__Core_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__drawer_7@INavigation__Drawer_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__elements_7@INavigation__Elements_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__native_7@INavigation__Native_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__native_stack_7@INavigation__NativeStack_0"

[[needs.module]]
id = "/com.amazon.kepler.navigation__routers_7@INavigation__Routers_0"














[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*"

[[offers.interaction]]
id = "com.drawyourhero.tv.main"

[[offers.module]]
id = "/com.drawyourhero.tv.main@IMod1"
includes-messages = ["pkg://com.drawyourhero.tv.main"]

[[message]]
uri = "pkg://com.drawyourhero.tv.main"
sender-privileges = ["*"]
receiver-privileges = ["self"]
